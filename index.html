<!DOCTYPE html>
<html lang="ru">
<head>

    <title>DevOps CI/CD Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="badge">CI/CD PROJECT</div>
